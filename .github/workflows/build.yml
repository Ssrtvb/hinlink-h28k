name: 每周自动编译 HINLINK H28K 固件

on:
  schedule:
    - cron: '23 21 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-hinlink-h28k
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: 检出支持仓库
        uses: actions/checkout@v4

      - name: 检查磁盘空间
        run: |
          echo "=== Initial disk space ==="
          df -h /

      - name: 清理磁盘空间
        run: |
          echo "=== Before cleanup ==="
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet 2>/dev/null || true
          sudo rm -rf /usr/local/lib/android 2>/dev/null || true
          sudo rm -rf /opt/ghc 2>/dev/null || true
          sudo rm -rf /opt/hostedtoolcache 2>/dev/null || true
          sudo rm -rf /usr/local/.ghcup 2>/dev/null || true
          sudo rm -rf /usr/local/share/powershell 2>/dev/null || true
          sudo rm -rf /usr/local/share/chromium 2>/dev/null || true
          sudo rm -rf /usr/share/swift 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          echo "=== After cleanup ==="
          df -h / | tail -1

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-dev python3-setuptools python3-pyelftools rsync \
            unzip zlib1g-dev file wget curl jq upx-ucl time

      - name: 选择最新正式版
        id: release
        run: |
          set -eu
          UPSTREAM=https://github.com/immortalwrt/immortalwrt.git
          RELEASE_TAG=""
          for tag in $(git ls-remote --tags --refs "$UPSTREAM" 'refs/tags/v*' \
            | awk -F/ '$3 ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ { print $3 }' \
            | sort -Vr); do
            version="${tag#v}"
            buildinfo="https://downloads.immortalwrt.org/releases/${version}/targets/rockchip/armv8/config.buildinfo"
            if curl -fsI "$buildinfo" >/dev/null; then
              RELEASE_TAG="$tag"
              break
            fi
          done
          test -n "$RELEASE_TAG"
          RELEASE_VERSION="${RELEASE_TAG#v}"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest stable release: $RELEASE_TAG"

      - name: 克隆正式版源码
        run: |
          git clone --branch "${{ steps.release.outputs.tag }}" --single-branch --depth=1 \
            https://github.com/immortalwrt/immortalwrt.git source
          test "$(git -C source describe --tags --exact-match)" = "${{ steps.release.outputs.tag }}"
          echo "=== Clone completed, disk space ==="
          df -h / | tail -1

      - name: 应用 HINLINK H28K 补丁
        working-directory: source
        run: |
          set -eu
          grep -qxF "src-git nikki https://github.com/nikkinikki-org/OpenWrt-nikki.git;main" feeds.conf.default || \
            echo "src-git nikki https://github.com/nikkinikki-org/OpenWrt-nikki.git;main" >> feeds.conf.default
          for patch in "$GITHUB_WORKSPACE"/patches/*.patch; do
            echo "=== Applying patch: $(basename "$patch") ==="
            git apply --check --3way "$patch" || {
              echo "Patch check failed: $patch"
              git apply --reject "$patch" || true
              find . -name '*.rej' -print -exec cat {} \;
              exit 1
            }
            git apply --3way "$patch"
          done
          git diff --check
          git diff --stat

      - name: 更新 feeds
        working-directory: source
        run: |
          set -eu
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 使用官方编译配置
        working-directory: source
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -eu
          BUILDINFO_URL="https://downloads.immortalwrt.org/releases/${RELEASE_VERSION}/targets/rockchip/armv8"
          curl -fsSL "$BUILDINFO_URL/config.buildinfo" -o .config.official

          sed -i -E \
            -e '/^CONFIG_TARGET_MULTI_PROFILE=/d' \
            -e '/^CONFIG_TARGET_ALL_PROFILES=/d' \
            -e '/^CONFIG_TARGET_PER_DEVICE_ROOTFS=/d' \
            -e '/^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_/d' \
            -e '/^CONFIG_TARGET_DEVICE_PACKAGES_rockchip_armv8_DEVICE_/d' \
            -e '/^CONFIG_TARGET_rockchip_armv8_DEVICE_/d' \
            .config.official

          cat >> .config.official <<'EOF'
          # CONFIG_TARGET_MULTI_PROFILE is not set
          # CONFIG_TARGET_ALL_PROFILES is not set
          # CONFIG_TARGET_PER_DEVICE_ROOTFS is not set
          EOF

          CUSTOM_CONFIG="$GITHUB_WORKSPACE/.github/configs/hinlink-h28k.config"
          awk '
            function config_key(line, parts) {
              if (line ~ /^CONFIG_[A-Za-z0-9_-]+=/) {
                split(line, parts, "=")
                return parts[1]
              }
              if (line ~ /^# CONFIG_[A-Za-z0-9_-]+ is not set$/) {
                sub(/^# /, "", line)
                sub(/ is not set$/, "", line)
                return line
              }
              return ""
            }
            NR == FNR {
              key = config_key($0)
              if (key != "") overrides[key] = 1
              custom[++count] = $0
              next
            }
            {
              key = config_key($0)
              if (key == "" || !(key in overrides)) print
            }
            END {
              for (i = 1; i <= count; i++) print custom[i]
            }
          ' "$CUSTOM_CONFIG" .config.official > .config
          make defconfig 2>&1 || {
            echo "=== defconfig failed ==="
            make defconfig V=sc
            exit 1
          }

          echo "=== Target device ==="
          grep '^CONFIG_TARGET_rockchip_armv8_DEVICE_.*=y$' .config
          grep -q '^CONFIG_TARGET_rockchip_armv8_DEVICE_hinlink_h28k=y$' .config
          grep -q '^CONFIG_ALL_KMODS=y$' .config
          grep -q '^CONFIG_ALL_NONSHARED=y$' .config
          grep -q '^CONFIG_TARGET_ROOTFS_EXT4FS=y$' .config
          grep -q '^CONFIG_TARGET_ROOTFS_SQUASHFS=y$' .config

      - name: 下载源码包
        working-directory: source
        timeout-minutes: 90
        run: |
          make -j"$(nproc)" download V=s
          find dl -size -1024c -print -delete
          echo "=== Download completed, disk space ==="
          df -h / | tail -1

      - name: 编译内核并校验 ABI
        working-directory: source
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -eu
          make -j"$(nproc)" tools/install V=s
          make -j"$(nproc)" toolchain/install V=s
          make -j"$(nproc)" target/linux/compile V=s

          PACKAGE_INDEX="https://downloads.immortalwrt.org/releases/${RELEASE_VERSION}/targets/rockchip/armv8/packages/index.json"
          OFFICIAL_KERNEL="$(curl -fsSL "$PACKAGE_INDEX" | jq -r '.packages.kernel')"
          OFFICIAL_ABI="$(printf '%s\n' "$OFFICIAL_KERNEL" \
            | sed -nE 's/.*~([0-9a-f]{32})-r[0-9]+/\1/p')"
          VERMAGIC_FILE="$(find build_dir/target-* \
            -path '*/linux-rockchip_armv8/linux-*/.vermagic' -print -quit)"
          test -n "$OFFICIAL_ABI"
          test -n "$VERMAGIC_FILE"
          BUILT_ABI="$(tr -d '[:space:]' < "$VERMAGIC_FILE")"

          {
            echo "release=$RELEASE_TAG"
            echo "source_commit=$(git rev-parse HEAD)"
            echo "official_kernel=$OFFICIAL_KERNEL"
            echo "official_abi=$OFFICIAL_ABI"
            echo "built_vermagic_file=$VERMAGIC_FILE"
            echo "built_abi=$BUILT_ABI"
          } | tee abi-report.txt

          if [ "$BUILT_ABI" != "$OFFICIAL_ABI" ]; then
            echo "Kernel ABI mismatch"
            exit 1
          fi
          echo "Kernel ABI matches the official release"

      - name: 编译固件
        working-directory: source
        timeout-minutes: 300
        run: |
          echo "=== Build started at $(date) ==="
          make -j"$(nproc)" V=s 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "exit code: $code"
          echo "=== Build finished at $(date), exit code: $code ==="
          echo "=== Disk space ==="
          df -h / | tail -1
          if [ "$code" -ne 0 ]; then
            tail -100 build.log
            exit "$code"
          fi

      - name: 检查固件产物
        working-directory: source
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          SQUASHFS_FIRMWARE="$(find bin/targets/rockchip/armv8 -maxdepth 1 -type f \
            -name '*hinlink_h28k*squashfs-sysupgrade.img.gz' -print -quit)"
          EXT4_FIRMWARE="$(find bin/targets/rockchip/armv8 -maxdepth 1 -type f \
            -name '*hinlink_h28k*ext4-sysupgrade.img.gz' -print -quit)"
          if [ -z "$SQUASHFS_FIRMWARE" ] || [ ! -f "$SQUASHFS_FIRMWARE" ]; then
            echo "SquashFS firmware file not found"
            ls -lh bin/targets/rockchip/armv8/ 2>/dev/null || true
            exit 1
          fi
          if [ -z "$EXT4_FIRMWARE" ] || [ ! -f "$EXT4_FIRMWARE" ]; then
            echo "ext4 firmware file not found"
            ls -lh bin/targets/rockchip/armv8/ 2>/dev/null || true
            exit 1
          fi
          CHECKSUM_FILE="bin/targets/rockchip/armv8/hinlink_h28k.sha256sums"
          sha256sum "$SQUASHFS_FIRMWARE" "$EXT4_FIRMWARE" | tee "$CHECKSUM_FILE"
          ls -lh "$SQUASHFS_FIRMWARE" "$EXT4_FIRMWARE" "$CHECKSUM_FILE" abi-report.txt
          echo "BUILD_DATE=$(TZ=Asia/Hong_Kong date +'%Y%m%d')" >> "$GITHUB_ENV"
          echo "UPSTREAM_HASH=$(git log -1 --format='%h')" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: 上传固件构件
        uses: actions/upload-artifact@v4
        with:
          name: HINLINK H28K 固件-${{ env.RELEASE_TAG }}
          path: |
            source/bin/targets/rockchip/armv8/*hinlink_h28k*ext4-sysupgrade.img.gz
            source/bin/targets/rockchip/armv8/*hinlink_h28k*squashfs-sysupgrade.img.gz
            source/bin/targets/rockchip/armv8/hinlink_h28k.sha256sums
            source/abi-report.txt
          retention-days: 30

      - name: 发布固件 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: h28k-${{ env.RELEASE_TAG }}-${{ env.BUILD_DATE }}
          name: "HINLINK H28K 固件 ${{ env.RELEASE_TAG }} (${{ env.BUILD_DATE }})"
          body: |
            ## HINLINK H28K weekly firmware

            - **Build date**: ${{ env.BUILD_DATE }}
            - **Upstream release**: ${{ env.RELEASE_TAG }} (${{ env.UPSTREAM_HASH }})
            - **Device**: HINLINK H28K (RK3528)
            - **Firmware**: ext4 and squashfs sysupgrade images
            - **Kernel ABI**: verified against the official release repository
          files: |
            source/bin/targets/rockchip/armv8/*hinlink_h28k*ext4-sysupgrade.img.gz
            source/bin/targets/rockchip/armv8/*hinlink_h28k*squashfs-sysupgrade.img.gz
            source/bin/targets/rockchip/armv8/hinlink_h28k.sha256sums
            source/abi-report.txt
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传失败编译日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 编译失败日志
          path: |
            source/build.log
            source/abi-report.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: 报告构建结果
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "HINLINK H28K build succeeded"
            echo "Release: https://github.com/${{ github.repository }}/releases/tag/h28k-${{ env.RELEASE_TAG }}-${{ env.BUILD_DATE }}"
          elif [ "${{ job.status }}" = "failure" ]; then
            echo "Build failed; check the logs above"
            echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "Build status: ${{ job.status }}"
          fi
