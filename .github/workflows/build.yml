name: Build HINLINK H28K

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/configs/hinlink-h28k.config"
      - ".github/workflows/build.yml"
      - "patches/**"

permissions:
  contents: read

concurrency:
  group: build-hinlink-h28k-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out support repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libelf-dev libncurses-dev libssl-dev \
            python3 python3-dev python3-pyelftools python3-setuptools \
            rsync swig unzip zlib1g-dev file wget

      - name: Check out upstream 25.12 source
        run: |
          git clone --depth 1 --branch openwrt-25.12 --single-branch \
            https://github.com/immortalwrt/immortalwrt.git source

      - name: Apply H28K patches
        working-directory: source
        run: |
          for patch in "$GITHUB_WORKSPACE"/patches/*.patch; do
            echo "Applying $(basename "$patch")"
            git apply --check "$patch"
            git apply "$patch"
          done
          git diff --check

      - name: Update feeds
        working-directory: source
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure H28K target
        working-directory: source
        run: |
          cp "$GITHUB_WORKSPACE/.github/configs/hinlink-h28k.config" .config
          make defconfig
          grep -q '^CONFIG_TARGET_rockchip_armv8_DEVICE_hinlink_h28k=y$' .config

      - name: Download sources
        working-directory: source
        run: |
          make -j"$(nproc)" download || make -j1 download V=s
          find dl -type f -size -1024c -delete

      - name: Build firmware
        working-directory: source
        run: make -j"$(nproc)"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: hinlink-h28k-25.12
          path: |
            source/bin/targets/rockchip/armv8/*hinlink_h28k*
            source/bin/targets/rockchip/armv8/sha256sums
          if-no-files-found: error
          retention-days: 7
